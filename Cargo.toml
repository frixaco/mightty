[package]
name = "mightty"
version = "0.1.0"
edition = "2024"

[lib]
name = "mightty"
path = "src/lib.rs"

[features]
# Opt into Ghostty's expensive page integrity audits when debugging its core.
ghostty-debug = []
# Research backend; native remains the default even when this feature is built.
portable-pty-experiment = ["dep:portable-pty", "windows-sys/Win32_System_LibraryLoader"]

[[bin]]
name = "mightty"
path = "src/main.rs"

[dependencies]
gpui = "0.2"
gpui-component = "0.5"
flume = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
portable-pty = { version = "=0.9.0", optional = true }

[patch.crates-io]
gpui = { path = "vendor/gpui" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Wdk_System_SystemServices",
] }
