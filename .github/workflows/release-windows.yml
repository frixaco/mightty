name: Release Windows package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: Check release version
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          $version = [regex]::Match(
            $manifest,
            '(?ms)^\[package\].*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"'
          ).Groups["version"].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo version $version."
          }

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is not configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "mightty-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          try {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -Password $password
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed MSIX and updater
        shell: pwsh
        run: |
          .\tools\package-windows.ps1 `
            -Publisher "${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}" `
            -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}" `
            -ReleaseBaseUri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.certificate.outputs.thumbprint }}"
          if ($thumbprint -match "^[0-9A-Fa-f]{40}$") {
            $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
            if (Test-Path -LiteralPath $certificatePath) {
              throw "The signing certificate remains installed."
            }
          }

      - name: Verify release artifacts without the private certificate
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          .\tools\verify-windows-release.ps1 `
            -ArtifactsDirectory .\artifacts\windows `
            -Publisher "${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}" `
            -Version $version `
            -Architecture x64

      - name: Publish Windows release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/windows/*
