name: Release Windows package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-07-16
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install pinned tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: Check release version
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw Cargo.toml
          $version = [regex]::Match(
            $manifest,
            '(?ms)^\[package\].*?^version\s*=\s*"(?<version>\d+\.\d+\.\d+)"'
          ).Groups["version"].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo version $version."
          }

      - name: Protect already published releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>&1
          if ($LASTEXITCODE -eq 0) {
            if ([string] $draft -ne "true") {
              throw "This tag already has a published release; do not replace its assets."
            }
          } elseif (($draft -join " ") -notmatch "release not found|HTTP 404") {
            throw "Cannot check the existing release: $draft"
          }

      - name: Import signing certificate
        id: certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            throw "WINDOWS_SIGNING_PFX_BASE64 is not configured."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "mightty-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:PFX_BASE64)
          )
          try {
            $password = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate `
              -FilePath $certificatePath `
              -CertStoreLocation "Cert:\CurrentUser\My" `
              -Password $password
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Build signed MSIX and updater
        shell: pwsh
        run: |
          .\tools\package-windows.ps1 `
            -Publisher "${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}" `
            -CertificateThumbprint "${{ steps.certificate.outputs.thumbprint }}" `
            -ReleaseBaseUri "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" `
            -AppInstallerUri "https://github.com/${{ github.repository }}/releases/latest/download/mightty-x64.appinstaller"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = "${{ steps.certificate.outputs.thumbprint }}"
          if ($thumbprint -match "^[0-9A-Fa-f]{40}$") {
            $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
            if (Test-Path -LiteralPath $certificatePath) {
              throw "The signing certificate remains installed."
            }
          }

      - name: Verify release artifacts without the private certificate
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          .\tools\verify-windows-release.ps1 `
            -ArtifactsDirectory .\artifacts\windows `
            -Publisher "${{ secrets.WINDOWS_PACKAGE_PUBLISHER }}" `
            -Version $version `
            -Architecture x64 `
            -ExpectedAppInstallerUri "https://github.com/${{ github.repository }}/releases/latest/download/mightty-x64.appinstaller"

      - name: Publish Windows release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          files: artifacts/windows/*

      - name: Publish complete release and advance stable feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = [version] $env:RELEASE_TAG.Substring(1)
          $latestTag = gh api "repos/$env:GH_REPO/releases/latest" --jq .tag_name 2>&1
          $advance = $false
          if ($LASTEXITCODE -ne 0) {
            if (($latestTag -join " ") -notmatch "HTTP 404") {
              throw "Cannot determine the current stable release: $latestTag"
            }
            $advance = $true
          }
          if (-not $advance) {
            $latestVersion = [version] ([string] $latestTag).TrimStart("v")
            $advance = $version -ge $latestVersion
          }
          $latest = if ($advance) { "true" } else { "false" }
          gh release edit $env:RELEASE_TAG --draft=false "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed." }
